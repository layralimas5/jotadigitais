# Deploy da Jota Digitais no Netlify.
# O index.html da raiz é a entrada do Vite; o build gera o site final em dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rotas do React Router (/contas, /admin, /pedido/...) abrem o app em vez de dar 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Arquivos com hash no nome nunca mudam: cache de 1 ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
